# Builds a portable Windows .exe on GitHub's Windows machines every time you
# push to main (or when you click "Run workflow" on the Actions tab).
# Download it from the run's "Artifacts" section.
name: Build Windows app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: YoursTruely-windows-portable
          path: release/*.exe
          if-no-files-found: error
